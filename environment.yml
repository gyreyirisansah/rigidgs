# Versions are the ones the paper's results were produced with
# (Python 3.10, PyTorch 2.8 + CUDA 12.9, NVIDIA RTX A6000).
name: rigidgs
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu129
      - torch==2.8.0
      - torchvision==0.23.0
      - numpy==1.26.4
      - scipy==1.11.4
      - scikit-image==0.25.2
      - scikit-learn==1.3.2
      # 4.10 is the last OpenCV built against NumPy 1.x (SciPy 1.11 and
      # scikit-learn 1.3 need NumPy < 2). albumentations pulls in the headless
      # build, so pin it to the same version.
      - opencv-python==4.10.0.84
      - opencv-python-headless==4.10.0.84
      - pillow==12.3.0
      - open3d==0.19.0
      - plyfile==1.1.2
      - pycolmap==3.12.6
      - tqdm==4.67.1
      - matplotlib==3.10.7
      - pandas==2.3.3
      - tensorboard==2.20.0
      - lpips==0.1.4
      - torchmetrics[image]==1.8.2
      # SAM 2
      - hydra-core==1.3.2
      - iopath==0.1.9
      # LaMa
      - omegaconf==2.3.0
      - PyYAML==6.0.3
      - albumentations==2.0.8
      - imgaug==0.4.0
      - kornia==0.8.1
      - pytorch-lightning==2.5.5
      - webdataset==1.0.2
      - easydict==1.13
      - timm==1.0.22
